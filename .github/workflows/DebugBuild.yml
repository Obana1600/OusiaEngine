name: DebugBuild

on:
  push:
    branches: 
      - master

env:
  SOLITION_FILE_PATH: 
  CONFIGURATION: Debug

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setpu-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        run: |
          msbuild ${{env.SOLITION_FILE_PATH}} /p:Platform=x64,Comfiguration=${{env.CONFIGURATION}}
