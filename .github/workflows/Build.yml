name: Build

on:
  push:
    branches:
      - master

env:
  SOLUTION_FILE_PATH: OusiaEngine/OusiaEngine.slnx

jobs:
  build:
    runs-on: windows-2025-vs2026

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Develop, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Build
        run: |
          msbuild ${{env.SOLUTION_FILE_PATH}} /m /p:Configuration=${{matrix.configuration}} /p:Platform=x64
